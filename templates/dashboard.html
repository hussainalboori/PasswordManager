<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        /* show password spans by default; masking is handled by JS text content */
        .password {
            font-family: monospace;
        }
    </style>
   <script>
    // When the user clicks a Show button, fetch the decrypted password from the server
    window.addEventListener('load', function() {
        document.querySelectorAll('.show-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                var id = this.getAttribute('data-id');
                var span = document.getElementById('pwd-' + id);
                var isMasked = span.textContent === '••••••••' || span.textContent === 'Error';
                var self = this;
                if (!isMasked) {
                    // currently visible -> hide
                    span.textContent = '••••••••';
                    self.textContent = 'Show';
                    return;
                }

                // fetch and show
                self.disabled = true;
                self.textContent = 'Loading...';
                fetch('/dashboard/password?id=' + encodeURIComponent(id), {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(function(res) {
                    if (!res.ok) throw new Error('Network response was not ok');
                    return res.json();
                })
                .then(function(data) {
                    span.textContent = data.password;
                    self.textContent = 'Hide';
                    self.disabled = false;
                })
                .catch(function(err) {
                    console.error(err);
                    span.textContent = 'Error';
                    self.textContent = 'Show';
                    self.disabled = false;
                });
            });
        });
    });
</script>
</head>
<body>
    <section id="dashboard">
        <nav class="navbar">
            <div class="container-xxl">
                <a href="/" class="navbar-brand">
                    <span class="fw-bold text-secondary">JassPass</span>
                </a>
                <div class="d-flex justify-content-center align-items-center" >
                    <strong style="margin-right: 20px;"><strong>welcome </strong>{{ .Username }}</strong>
                    <a href="/logout" class="btn btn-secondary">Logout</a>
                </div>
                </div>
                </div>
            </div>
        </nav>
        <div class="container-lg">
            <div class="row justify-content-center align-items-center">
                <div class="col-md-5 text-center text-md-start">
                    <h1>
                        <div class="display-2">Dashboard</div>
                        <div class="display-5 text-muted">Your passwords</div>
                        <ul>
                            <!-- List of passwords metadata here -->
                            {{ range .Passwords }}
                                <li data-id="{{ .Id }}">
                                    <p><strong>Website:</strong> {{ .Website }}</p>
                                    <p><strong>Username:</strong> {{ .Username }}</p>
                                    <p><strong>Password:</strong> <span class="password" id="pwd-{{ .Id }}">••••••••</span>
                                        <button class="btn btn-sm btn-outline-primary ms-2 show-btn" data-id="{{ .Id }}">Show</button>
                                    </p>
                                    <!-- Delete button -->
                                    <form method="POST" action="/dashboard/delete">
                                        <button type="submit" name="id" value="{{ .Id }}" class="btn btn-danger">Delete</button>
                                    </form>
                                </li>
                            {{ end }}
                            <li>
                                <a href="/dashboard/new">Add New Password</a>
                            </li>
                        </ul>
                        
                    </h1>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
